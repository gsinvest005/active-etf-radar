<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>·</title>
<style>
  :root{
    --bg:#F4F2EC; --surface:#FBFAF6; --surface-2:#ECE8DE; --shell:rgba(20,18,12,.035);
    --ink:#1B1E24; --ink-2:#565B63; --muted:#8B8F97;
    --hair:rgba(20,18,12,.12); --hair-soft:rgba(20,18,12,.07); --grid:rgba(20,18,12,.08);
    --buy:#CC352E; --buy-2:#E0554E; --buy-soft:rgba(204,53,46,.13);
    --sell:#1E9A6C; --sell-2:#28ac7b; --sell-soft:rgba(30,154,108,.13);
    --gold:#A9791F; --gold-soft:rgba(169,121,31,.14);
    --shadow:0 1px 2px rgba(20,18,12,.05),0 12px 32px -18px rgba(20,18,12,.22);
    --inset:inset 0 1px 0 rgba(255,255,255,.7);
    --r:20px; --r-in:14px;
    --mono:ui-monospace,"Cascadia Code","SF Mono","Consolas","Menlo",monospace;
    --sans:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Segoe UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0B0E13; --surface:#12161D; --surface-2:#1A1F29; --shell:rgba(255,255,255,.04);
      --ink:#ECEEF2; --ink-2:#A4A9B3; --muted:#6C7280;
      --hair:rgba(255,255,255,.12); --hair-soft:rgba(255,255,255,.07); --grid:rgba(255,255,255,.09);
      --buy:#FF5D54; --buy-2:#ff7a72; --buy-soft:rgba(255,93,84,.16);
      --sell:#34C79A; --sell-2:#54d3ad; --sell-soft:rgba(52,199,154,.15);
      --gold:#E3B85B; --gold-soft:rgba(227,184,91,.16);
      --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -22px rgba(0,0,0,.7);
      --inset:inset 0 1px 0 rgba(255,255,255,.06);
    }
  }
  :root[data-theme="light"]{
    --bg:#F4F2EC; --surface:#FBFAF6; --surface-2:#ECE8DE; --shell:rgba(20,18,12,.035);
    --ink:#1B1E24; --ink-2:#565B63; --muted:#8B8F97;
    --hair:rgba(20,18,12,.12); --hair-soft:rgba(20,18,12,.07); --grid:rgba(20,18,12,.08);
    --buy:#CC352E; --buy-2:#E0554E; --buy-soft:rgba(204,53,46,.13);
    --sell:#1E9A6C; --sell-2:#28ac7b; --sell-soft:rgba(30,154,108,.13);
    --gold:#A9791F; --gold-soft:rgba(169,121,31,.14);
    --shadow:0 1px 2px rgba(20,18,12,.05),0 12px 32px -18px rgba(20,18,12,.22);
    --inset:inset 0 1px 0 rgba(255,255,255,.7);
  }
  :root[data-theme="dark"]{
    --bg:#0B0E13; --surface:#12161D; --surface-2:#1A1F29; --shell:rgba(255,255,255,.04);
    --ink:#ECEEF2; --ink-2:#A4A9B3; --muted:#6C7280;
    --hair:rgba(255,255,255,.12); --hair-soft:rgba(255,255,255,.07); --grid:rgba(255,255,255,.09);
    --buy:#FF5D54; --buy-2:#ff7a72; --buy-soft:rgba(255,93,84,.16);
    --sell:#34C79A; --sell-2:#54d3ad; --sell-soft:rgba(52,199,154,.15);
    --gold:#E3B85B; --gold-soft:rgba(227,184,91,.16);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 44px -22px rgba(0,0,0,.7);
    --inset:inset 0 1px 0 rgba(255,255,255,.06);
  }

  *{box-sizing:border-box}
  html,body{max-width:100%;overflow-x:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;
    -webkit-font-smoothing:antialiased;margin:0;
    background-image:radial-gradient(120% 80% at 88% -8%,var(--buy-soft),transparent 55%),radial-gradient(120% 80% at 6% 0%,var(--sell-soft),transparent 50%);
    background-attachment:fixed;}
  .wrap{width:100%;max-width:1320px;min-width:0;margin:0 auto;padding:22px clamp(14px,3vw,36px) 64px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  .eyebrow{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-weight:700}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--hair)}
  .brand{min-width:0}
  .brand h1{font-size:clamp(21px,5vw,32px);font-weight:800;letter-spacing:-.02em;margin:.28em 0 .12em;text-wrap:balance}
  .brand h1 b{color:var(--buy);font-weight:800}
  .brand p{margin:0;color:var(--ink-2);font-size:13.5px}
  .hmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
  .pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--hair);
    border-radius:999px;padding:7px 13px;font-size:12px;color:var(--ink-2);box-shadow:var(--inset);
    min-width:0;max-width:100%;flex-wrap:wrap}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--sell);box-shadow:0 0 0 3px var(--sell-soft)}
  .pill .datev{font-family:var(--mono);color:var(--ink);font-weight:600;letter-spacing:.02em}
  .toggle{cursor:pointer;background:var(--surface);border:1px solid var(--hair);border-radius:999px;flex:0 0 auto;
    width:38px;height:38px;display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--inset);transition:transform .5s cubic-bezier(.32,.72,0,1),color .3s}
  .toggle:hover{color:var(--ink);transform:rotate(18deg)}
  .toggle:focus-visible{outline:2px solid var(--buy);outline-offset:2px}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  .kpi{position:relative;background:var(--shell);border:1px solid var(--hair-soft);border-radius:var(--r);padding:6px}
  .kpi-in{background:var(--surface);border:1px solid var(--hair-soft);border-radius:var(--r-in);padding:14px 15px 15px;box-shadow:var(--inset);height:100%}
  .kpi .lab{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.02em}
  .kpi .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(18px,2.4vw,25px);letter-spacing:-.02em;margin-top:8px;line-height:1}
  .kpi .sub{font-size:11.5px;color:var(--ink-2);margin-top:7px}
  .kpi .tag{position:absolute;top:13px;right:14px;font-size:10px;font-family:var(--mono);color:var(--muted)}
  .up{color:var(--buy)} .down{color:var(--sell)} .goldc{color:var(--gold)}

  .tabbar{position:sticky;top:10px;z-index:20;display:flex;gap:6px;padding:6px;margin-bottom:18px;
    background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(10px);
    border:1px solid var(--hair);border-radius:999px;box-shadow:var(--shadow);overflow-x:auto;
    max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:1 0 auto;white-space:nowrap;cursor:pointer;border:0;background:transparent;color:var(--ink-2);
    font-family:var(--sans);font-size:13.5px;font-weight:700;padding:11px 18px;border-radius:999px;min-height:44px;
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    transition:color .3s,background .4s cubic-bezier(.32,.72,0,1)}
  .tab .ic{font-size:14px}
  .tab .n{font-family:var(--mono);font-size:11px;font-weight:600;opacity:.55}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
  .tab[aria-selected="true"] .n{opacity:.6}
  .tab:focus-visible{outline:2px solid var(--buy);outline-offset:2px}

  .pane{display:none}
  .pane.active{display:block}
  .pane.active .card{animation:paneIn .55s cubic-bezier(.22,.7,0,1) both}
  .pane.active .card:nth-child(2){animation-delay:.09s}
  @keyframes paneIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;min-width:0}
  .card{grid-column:span 12;min-width:0;background:var(--shell);border:1px solid var(--hair-soft);border-radius:calc(var(--r) + 2px);padding:7px}
  .card-in{min-width:0;background:var(--surface);border:1px solid var(--hair-soft);border-radius:var(--r);box-shadow:var(--shadow),var(--inset);padding:20px 22px 22px;height:100%}
  .col6{grid-column:span 6}
  .chd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
  .chd h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
  .chd .hint{font-size:11.5px;color:var(--muted);text-align:right}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-bottom:14px;flex-wrap:wrap}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

  .rows{display:flex;flex-direction:column;gap:11px;min-width:0;overflow-x:auto}
  .row{display:grid;grid-template-columns:108px minmax(44px,1fr) max-content;align-items:center;gap:13px;cursor:default;min-width:0}
  .row .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm small{color:var(--muted);font-family:var(--mono);font-weight:500;font-size:11px;margin-left:4px}
  .track{position:relative;height:24px;background:var(--surface-2);border-radius:7px;overflow:hidden}
  .fill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:7px;transition:width .85s cubic-bezier(.32,.72,0,1)}
  .fill.b{background:linear-gradient(90deg,var(--buy),var(--buy-2))}
  .fill.s{background:linear-gradient(90deg,var(--sell),var(--sell-2))}
  .row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:700;text-align:right;min-width:74px;white-space:nowrap}
  .row .cnt{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:5px}
  .row:hover .track{outline:1px solid var(--hair)}

  .svgbox{width:100%;max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .axis{stroke:var(--grid);stroke-width:1}
  .zero{stroke:var(--hair);stroke-width:1.5}
  .tk{fill:var(--muted);font-size:12px;font-family:var(--mono)}
  .slabel{fill:var(--ink-2);font-size:13px}
  .sval{fill:var(--ink);font-size:12px;font-family:var(--mono);font-weight:700}
  .bar-b{fill:var(--buy);transition:width .8s cubic-bezier(.32,.72,0,1)}
  .bar-s{fill:var(--sell);transition:width .8s cubic-bezier(.32,.72,0,1)}
  .hit{cursor:pointer}

  .lolls{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 30px}
  .loll{display:grid;grid-template-columns:104px 1fr 32px;align-items:center;gap:12px}
  .loll .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loll .stick{position:relative;height:16px}
  .loll .line{position:absolute;top:50%;left:7px;height:2px;background:var(--hair);transform:translateY(-50%)}
  .loll .beads{position:absolute;top:50%;left:0;transform:translateY(-50%);display:flex;gap:6px}
  .loll .bead{width:15px;height:15px;border-radius:50%;background:var(--sell);box-shadow:0 0 0 3px var(--sell-soft)}
  .loll.buy .bead{background:var(--buy);box-shadow:0 0 0 3px var(--buy-soft)}
  .loll .c{font-family:var(--mono);font-weight:700;font-size:14px;text-align:right}

  .faces{display:grid;grid-template-columns:repeat(2,1fr);gap:0 30px}
  .face{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--hair-soft)}
  .face .ic{width:34px;height:34px;border-radius:10px;background:var(--buy-soft);color:var(--buy);display:grid;place-items:center;font-size:14px;flex:none}
  .face .t{flex:1;min-width:0}
  .face .t b{font-size:14px;font-weight:700}
  .face .t small{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:5px}
  .face .t p{margin:2px 0 0;font-size:11.5px;color:var(--ink-2)}
  .face .amt{font-family:var(--mono);font-weight:700;font-size:13.5px;color:var(--buy);white-space:nowrap}

  .skill{display:flex;flex-direction:column;gap:13px}
  .srow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;cursor:default;min-width:0}
  .srow .who{display:flex;flex-direction:column;gap:1px}
  .srow .who b{font-family:var(--mono);font-size:13.5px;font-weight:700}
  .srow .who small{font-size:11px;color:var(--muted)}
  .sbar{position:relative;height:32px;background:var(--surface-2);border-radius:8px}
  .smid{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--hair)}
  .sfill{position:absolute;top:5px;bottom:5px;width:0;border-radius:6px;transition:width .85s cubic-bezier(.32,.72,0,1)}
  .sfill.pos{background:linear-gradient(90deg,var(--gold),#d9b874)}
  .sfill.neg{background:linear-gradient(90deg,#b9bdc4,#9aa0a8)}
  .srow .sv{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12.5px;font-weight:700}
  .medal{font-size:13px;margin-right:3px}

  .foot{margin-top:24px;padding-top:16px;border-top:1px solid var(--hair);color:var(--muted);font-size:11.5px;line-height:1.7}
  .foot b{color:var(--ink-2);font-weight:600}
  .foot .warning{margin-top:6px}

  #tip{position:fixed;z-index:90;pointer-events:none;opacity:0;
    transition:opacity .12s;background:var(--surface);border:1px solid var(--hair);border-radius:12px;
    box-shadow:var(--shadow);padding:11px 13px;font-size:12.5px;width:max-content;
    max-width:min(280px,calc(100vw - 16px));color:var(--ink)}
  #tip .tt{font-weight:700;margin-bottom:5px;font-size:13px}
  #tip .tl{color:var(--ink-2);display:flex;justify-content:space-between;gap:16px;font-size:12px}
  #tip .tl .num{color:var(--ink);font-weight:600}
  #tip.b .tt{color:var(--buy)} #tip.s .tt{color:var(--sell)} #tip.g .tt{color:var(--gold)}

  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .col6{grid-column:span 12}
    .lolls,.faces{grid-template-columns:1fr}
    .tabbar{justify-content:flex-start;scroll-snap-type:x mandatory;overscroll-behavior-inline:contain}
    .tab{flex:0 0 auto;scroll-snap-align:start;padding-inline:15px}
    .tab .n{display:none}
    .toggle{width:44px;height:44px;min-width:44px;min-height:44px}
    .svgbox svg{width:760px;max-width:none}
  }
  @media (max-width:560px){
    .wrap{padding:16px 10px 48px}
    header{align-items:flex-start;gap:14px}
    .hmeta{width:100%;gap:8px}
    .kpis{grid-template-columns:1fr}
    .card-in{padding:16px 12px 18px}
    .chd{align-items:flex-start;flex-direction:column;gap:4px}
    .chd .hint{text-align:left}
    .row{grid-template-columns:minmax(76px,90px) minmax(44px,1fr) max-content;gap:8px}
    .row .v{min-width:0;font-size:12.5px}
    .row .cnt{display:block;margin-left:0;text-align:right}
    .loll{grid-template-columns:minmax(78px,94px) minmax(72px,1fr) 28px;gap:8px}
    .srow{grid-template-columns:1fr;gap:7px}
    .face{gap:9px}
    .face .amt{font-size:12.5px}
    .svgbox svg{width:720px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
